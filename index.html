<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexusShop - Premium Tech Store</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .glass-panel {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen flex flex-col justify-between antialiased selection:bg-orange-500 selection:text-white">

    <!-- HEADER -->
    <header class="h-20 glass-panel border-b border-slate-800 flex items-center justify-between px-6 md:px-12 sticky top-0 z-50">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-orange-500 to-amber-600 flex items-center justify-center text-slate-950 font-bold shadow-lg shadow-orange-500/20">
                <i data-lucide="shopping-bag" class="w-5 h-5 text-white"></i>
            </div>
            <div>
                <h1 class="font-bold text-lg text-white tracking-wide">Nexus<span class="text-orange-500">Shop</span></h1>
                <p class="text-xs text-slate-400" data-i18n="subtitle">Tech Gear & Audio</p>
            </div>
        </div>

        <div class="flex items-center gap-4">
            <!-- BOTÃO IDIOMA (PT/EN) -->
            <button onclick="toggleLanguage()" class="flex items-center gap-2 px-3 py-2 rounded-xl bg-slate-900 border border-slate-800 hover:border-orange-500/50 text-xs font-semibold text-slate-300 transition-all cursor-pointer">
                <i data-lucide="globe" class="w-4 h-4 text-orange-500"></i>
                <span id="langLabel">PT / EN</span>
            </button>

            <!-- BOTÃO ABRIR CARRINHO -->
            <button onclick="toggleCart()" class="relative flex items-center gap-2 px-4 py-2.5 rounded-xl bg-orange-500 hover:bg-orange-600 text-slate-950 font-bold text-xs transition-all shadow-lg shadow-orange-500/20 cursor-pointer">
                <i data-lucide="shopping-cart" class="w-4 h-4 text-slate-950"></i>
                <span data-i18n="btn_cart">Cart</span>
                <span id="cartBadge" class="absolute -top-2 -right-2 bg-slate-900 text-orange-400 border border-orange-500/40 text-[10px] font-mono font-bold w-5 h-5 rounded-full flex items-center justify-center shadow-md">0</span>
            </button>
        </div>
    </header>

    <!-- MAIN CONTAINER -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-6 md:p-10">
        
        <!-- BARRA DE PESQUISA E FILTROS -->
        <div class="flex flex-col md:flex-row items-center justify-between gap-4 mb-8">
            <div class="relative w-full md:w-96">
                <i data-lucide="search" class="w-4 h-4 text-slate-400 absolute left-3.5 top-3.5"></i>
                <input type="text" id="searchInput" oninput="filterProducts()" placeholder="Search tech products..." data-i18n-placeholder="ph_search"
                    class="w-full bg-slate-900 border border-slate-800 rounded-xl pl-10 pr-4 py-3 text-sm text-white focus:outline-none focus:border-orange-500 transition-all">
            </div>

            <div class="flex items-center gap-2 overflow-x-auto w-full md:w-auto pb-2 md:pb-0">
                <button onclick="setCategory('all')" id="cat-all" class="px-4 py-2 rounded-xl bg-orange-500 text-slate-950 font-bold text-xs transition-all shadow-sm cursor-pointer" data-i18n="cat_all">All</button>
                <button onclick="setCategory('audio')" id="cat-audio" class="px-4 py-2 rounded-xl bg-slate-900 border border-slate-800 text-slate-300 hover:text-white font-semibold text-xs transition-all cursor-pointer" data-i18n="cat_audio">Audio</button>
                <button onclick="setCategory('wearables')" id="cat-wearables" class="px-4 py-2 rounded-xl bg-slate-900 border border-slate-800 text-slate-300 hover:text-white font-semibold text-xs transition-all cursor-pointer" data-i18n="cat_wearables">Wearables</button>
                <button onclick="setCategory('accessories')" id="cat-accessories" class="px-4 py-2 rounded-xl bg-slate-900 border border-slate-800 text-slate-300 hover:text-white font-semibold text-xs transition-all cursor-pointer" data-i18n="cat_accessories">Accessories</button>
            </div>
        </div>

        <!-- GRADE DE PRODUTOS -->
        <div id="productGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6"></div>
    </main>

    <!-- PAINEL LATERAL DO CARRINHO (DRAWER) -->
    <div id="cartDrawer" class="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm hidden flex justify-end transition-all">
        <div class="w-full max-w-md bg-slate-900 border-l border-slate-800 h-full flex flex-col justify-between p-6 shadow-2xl">
            <div>
                <div class="flex items-center justify-between pb-4 border-b border-slate-800">
                    <h3 class="font-bold text-lg text-white flex items-center gap-2">
                        <i data-lucide="shopping-cart" class="w-5 h-5 text-orange-500"></i>
                        <span data-i18n="cart_title">Shopping Cart</span>
                    </h3>
                    <button onclick="toggleCart()" class="text-slate-400 hover:text-white p-1 cursor-pointer">
                        <i data-lucide="x" class="w-5 h-5"></i>
                    </button>
                </div>
                <div id="cartItemsList" class="space-y-4 py-4 overflow-y-auto max-h-[60vh]"></div>
            </div>

            <div class="border-t border-slate-800 pt-4 space-y-4">
                <div class="flex justify-between items-center text-sm">
                    <span class="text-slate-400" data-i18n="cart_total">Total:</span>
                    <span id="cartTotalPrice" class="text-xl font-bold text-orange-400">$0.00</span>
                </div>
                <button onclick="checkout()" class="w-full py-3.5 rounded-xl bg-orange-500 hover:bg-orange-600 text-slate-950 font-bold text-sm transition-all shadow-lg shadow-orange-500/20 cursor-pointer" data-i18n="btn_checkout">
                    Proceed to Checkout
                </button>
            </div>
        </div>
    </div>

    <!-- FOOTER -->
    <footer class="border-t border-slate-800 py-6 text-center text-xs text-slate-500">
        <p>© 2026 NexusShop. Engineered by Andréia Antunes.</p>
    </footer>

    <!-- LÓGICA JAVASCRIPT & E-COMMERCE -->
    <script>
        lucide.createIcons();

        const translations = {
            en: {
                subtitle: "Tech Gear & Audio",
                btn_cart: "Cart",
                ph_search: "Search tech products...",
                cat_all: "All",
                cat_audio: "Audio",
                cat_wearables: "Wearables",
                cat_accessories: "Accessories",
                cart_title: "Shopping Cart",
                cart_total: "Total:",
                btn_checkout: "Proceed to Checkout",
                btn_add_cart: "Add to Cart",
                empty_cart: "Your cart is empty."
            },
            pt: {
                subtitle: "Acessórios e Áudio Tech",
                btn_cart: "Carrinho",
                ph_search: "Pesquisar produtos...",
                cat_all: "Todos",
                cat_audio: "Áudio",
                cat_wearables: "Vestíveis",
                cat_accessories: "Acessórios",
                cart_title: "Carrinho de Compras",
                cart_total: "Total:",
                btn_checkout: "Finalizar Compra",
                btn_add_cart: "Adicionar ao Carrinho",
                empty_cart: "O seu carrinho está vazio."
            }
        };

        let currentLang = 'en';
        let currentCategory = 'all';
        let cart = [];

        // Lista de Produtos com URLs de Imagens HD do Unsplash
        const products = [
            { 
                id: 1, 
                name: "Zeus Pro Wireless Headset", 
                category: "audio", 
                price: 89.99, 
                image: "https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=600&auto=format&fit=crop&q=80" 
            },
            { 
                id: 2, 
                name: "Quantum Smartwatch X", 
                category: "wearables", 
                price: 199.99, 
                image: "https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=600&auto=format&fit=crop&q=80" 
            },
            { 
                id: 3, 
                name: "Mechanical RGB Keyboard", 
                category: "accessories", 
                price: 129.50, 
                image: "https://images.unsplash.com/photo-1587829741301-dc798b83add3?w=600&auto=format&fit=crop&q=80" 
            },
            { 
                id: 4, 
                name: "Ultra-Fast GaN Charger 100W", 
                category: "accessories", 
                price: 49.99, 
                image: "https://images.unsplash.com/photo-1583863788434-e58a36330cf0?w=600&auto=format&fit=crop&q=80" 
            },
            { 
                id: 5, 
                name: "Noise-Canceling Earbuds Pro", 
                category: "audio", 
                price: 149.00, 
                image: "https://images.unsplash.com/photo-1590658268037-6bf12165a8df?w=600&auto=format&fit=crop&q=80" 
            },
            { 
                id: 6, 
                name: "Ergonomic Gaming Mouse", 
                category: "accessories", 
                price: 59.99, 
                image: "https://images.unsplash.com/photo-1615663245857-ac93bb7c39e7?w=600&auto=format&fit=crop&q=80" 
            }
        ];

        function toggleLanguage() {
            currentLang = currentLang === 'en' ? 'pt' : 'en';
            document.getElementById('langLabel').innerText = currentLang === 'en' ? 'PT / EN' : 'EN / PT';
            
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (translations[currentLang][key]) {
                    el.innerText = translations[currentLang][key];
                }
            });

            document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
                const key = el.getAttribute('data-i18n-placeholder');
                if (translations[currentLang][key]) {
                    el.placeholder = translations[currentLang][key];
                }
            });
            renderProducts();
            renderCart();
        }

        function setCategory(cat) {
            currentCategory = cat;
            ['all', 'audio', 'wearables', 'accessories'].forEach(c => {
                const btn = document.getElementById(`cat-${c}`);
                if (c === cat) {
                    btn.className = "px-4 py-2 rounded-xl bg-orange-500 text-slate-950 font-bold text-xs transition-all shadow-sm cursor-pointer";
                } else {
                    btn.className = "px-4 py-2 rounded-xl bg-slate-900 border border-slate-800 text-slate-300 hover:text-white font-semibold text-xs transition-all cursor-pointer";
                }
            });
            renderProducts();
        }

        function renderProducts() {
            const grid = document.getElementById('productGrid');
            const searchVal = document.getElementById('searchInput').value.toLowerCase();
            grid.innerHTML = '';

            const filtered = products.filter(p => {
                const matchCat = currentCategory === 'all' || p.category === currentCategory;
                const matchSearch = p.name.toLowerCase().includes(searchVal);
                return matchCat && matchSearch;
            });

            if (filtered.length === 0) {
                grid.innerHTML = `<p class="col-span-full text-center text-slate-500 py-10 text-sm">No products found.</p>`;
                return;
            }

            filtered.forEach(p => {
                const card = document.createElement('div');
                card.className = "glass-panel p-5 rounded-2xl border border-slate-800 flex flex-col justify-between gap-4 hover:border-orange-500/40 transition-all group";
                card.innerHTML = `
                    <div class="h-48 rounded-xl overflow-hidden bg-slate-900 relative">
                        <img src="${p.image}" alt="${p.name}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300">
                        <span class="absolute top-3 left-3 text-[10px] uppercase font-mono font-bold text-orange-400 bg-slate-950/80 backdrop-blur-md px-2.5 py-1 rounded-md border border-orange-500/30">${p.category}</span>
                    </div>
                    <div>
                        <h3 class="font-bold text-white text-base leading-snug">${p.name}</h3>
                        <p class="text-xl font-extrabold text-orange-400 mt-1">$${p.price.toFixed(2)}</p>
                    </div>
                    <button onclick="addToCart(${p.id})" class="w-full py-2.5 rounded-xl bg-slate-900 hover:bg-orange-500 hover:text-slate-950 border border-slate-800 text-slate-200 font-bold text-xs transition-all flex items-center justify-center gap-2 cursor-pointer">
                        <i data-lucide="plus" class="w-4 h-4"></i>
                        <span>${translations[currentLang].btn_add_cart}</span>
                    </button>
                `;
                grid.appendChild(card);
            });
            lucide.createIcons();
        }

        function filterProducts() {
            renderProducts();
        }

        function toggleCart() {
            document.getElementById('cartDrawer').classList.toggle('hidden');
        }

        function addToCart(id) {
            const product = products.find(p => p.id === id);
            const existing = cart.find(item => item.id === id);
            if (existing) {
                existing.qty++;
            } else {
                cart.push({ ...product, qty: 1 });
            }
            renderCart();
            toggleCart();
        }

        function changeQty(id, delta) {
            const item = cart.find(i => i.id === id);
            if (!item) return;
            item.qty += delta;
            if (item.qty <= 0) {
                cart = cart.filter(i => i.id !== id);
            }
            renderCart();
        }

        function renderCart() {
            const list = document.getElementById('cartItemsList');
            const badge = document.getElementById('cartBadge');
            const totalPriceEl = document.getElementById('cartTotalPrice');
            
            list.innerHTML = '';
            let totalCount = 0;
            let totalPrice = 0;

            if (cart.length === 0) {
                list.innerHTML = `<p class="text-center text-slate-500 text-xs py-8">${translations[currentLang].empty_cart}</p>`;
            }

            cart.forEach(item => {
                totalCount += item.qty;
                totalPrice += item.price * item.qty;

                const row = document.createElement('div');
                row.className = "flex items-center justify-between bg-slate-950/60 p-3 rounded-xl border border-slate-800 gap-3";
                row.innerHTML = `
                    <img src="${item.image}" alt="${item.name}" class="w-12 h-12 rounded-lg object-cover">
                    <div class="flex-1">
                        <h4 class="text-xs font-bold text-white line-clamp-1">${item.name}</h4>
                        <p class="text-xs text-orange-400 mt-0.5">$${item.price.toFixed(2)}</p>
                    </div>
                    <div class="flex items-center gap-2">
                        <button onclick="changeQty(${item.id}, -1)" class="w-6 h-6 rounded bg-slate-800 text-slate-300 flex items-center justify-center text-xs cursor-pointer hover:bg-slate-700">-</button>
                        <span class="text-xs font-mono font-bold text-white">${item.qty}</span>
                        <button onclick="changeQty(${item.id}, 1)" class="w-6 h-6 rounded bg-slate-800 text-slate-300 flex items-center justify-center text-xs cursor-pointer hover:bg-slate-700">+</button>
                    </div>
                `;
                list.appendChild(row);
            });

            badge.innerText = totalCount;
            totalPriceEl.innerText = `$${totalPrice.toFixed(2)}`;
        }

        function checkout() {
            if (cart.length === 0) return;
            alert(currentLang === 'en' ? 'Order placed successfully! Thank you for shopping with NexusShop.' : 'Pedido realizado com sucesso! Obrigado por comprar na NexusShop.');
            cart = [];
            renderCart();
            toggleCart();
        }

        renderProducts();
    </script>
</body>
</html>
